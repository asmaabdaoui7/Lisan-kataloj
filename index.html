<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- حماية موسوعة التشغيل والملكية من الفهرسة في محركات البحث -->
  <title>موسوعة التشغيل والملكية — لِسَان | LISAN</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#b88a44" />

  <!-- أيقونة تبويب المتصفح بطابع السيادة الذهبي -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23b88a44'/%3E%3Cstop offset='100%25' stop-color='%238c621d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='serif' font-weight='700' font-size='36'%3Eل%3C/text%3E%3C/svg%3E" />

  <!-- الخطوط العربية: Amiri الأصيل + IBM Plex Sans Arabic العصري -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ملف المظهر الشامل -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 1. بوابة الحماية الحصرية للإدارة العليا (مقصورة على البريد الرسمي المالك) -->
  <section id="auth-gate" class="auth-gate" aria-label="بوابة الدخول للإدارة العليا">
    <div class="glass-card auth-card heritage-frame">
      <div id="auth-gate-box">
        <div class="auth-badge" aria-hidden="true">ل</div>
        <h1 class="auth-title">موسوعة التشغيل والملكية — لِسَان</h1>
        <p class="auth-subtitle">جارٍ التحقق من الجلسة الآمنة...</p>
      </div>
    </div>
    <p class="dev-credit">تطوير Rawi Al-Shamal</p>
  </section>

  <!-- 2. واجهة موسوعة التشغيل والملكية الكاملة -->
  <div id="manual-app" hidden>
    <header class="manual-header">
      <div class="container header-inner">
        <button type="button" id="manual-brand-home" class="brand-btn" aria-label="العودة إلى محور اليوم الأول">
          <div class="brand-logo-box" aria-hidden="true">ل</div>
          <div class="brand-texts">
            <span class="brand-title">موسوعة التشغيل والملكية</span>
            <span class="brand-subtitle">المرجع النهائي للإدارة العليا — لِسَان | LISAN</span>
          </div>
        </button>

        <div class="header-actions">
          <button type="button" id="open-spotlight-btn" class="tool-btn header-action-btn icon-compact" aria-label="بحث ذكي داخل الموسوعة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span class="btn-label">بحث ذكي</span>
          </button>

          <button type="button" id="owner-logout-btn" class="tool-btn danger header-action-btn" aria-label="تسجيل الخروج">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="btn-label">خروج</span>
          </button>
        </div>
      </div>
    </header>

    <!-- شريط المحاور الخمسة -->
    <div class="manual-tabs-strip">
      <div class="container">
        <nav id="manual-tabs-nav" class="manual-tabs-nav" aria-label="محاور موسوعة التشغيل والملكية"></nav>
      </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container" style="flex: 1;">
      <main id="manual-main" aria-live="polite"></main>
    </div>

    <!-- التذييل -->
    <footer class="manual-footer">
      <div class="container manual-footer-inner">
        <p class="manual-footer-copy">وثيقة التشغيل والملكية الرسمية — منصة لِسَان | LISAN</p>
        <p class="dev-credit">تطوير Rawi Al-Shamal</p>
      </div>
    </footer>
  </div>

  <!-- 3. نافذة البحث العربي الذكي الشامل (Spotlight) -->
  <div id="spotlight-modal" class="glass-modal-backdrop" role="dialog" aria-modal="true" aria-label="البحث الذكي في موسوعة التشغيل والملكية" hidden>
    <div class="spotlight-modal">
      <div class="spotlight-header">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); flex-shrink: 0;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="spotlight-input" placeholder="ابحث عن: صلاحية، دومين، Cloudflare، تذكرة، بطاقة، قريباً، استعادة..." autocomplete="off" />
        <button type="button" id="close-spotlight-btn" class="tool-btn">إغلاق</button>
      </div>
      <div id="spotlight-results" class="spotlight-results"></div>
    </div>
  </div>

  <!-- 4. حاوية الإشعارات الزجاجية -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- المحرك الرئيسي لموسوعة التشغيل والملكية -->
  <script type="module" src="./app.js"></script>
</body>
</html>
